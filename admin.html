<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taste Lahore Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #151515;
      --surface: #222222;
      --surface-light: #2d2d2d;
      --text: #f4f1ed;
      --muted: #aaa39c;
      --accent: #e34b38;
      --border: #3c3a38;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
    h1, h2, h3 { margin-top: 0; }
    h1 { color: var(--accent); letter-spacing: 0.02em; }
    .panel, .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
    }
    .login-panel { max-width: 440px; margin: 10vh auto 0; }
    label { display: block; margin: 16px 0 7px; color: var(--muted); }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-light);
      color: var(--text);
      font: inherit;
    }
    button {
      margin-top: 20px;
      padding: 11px 18px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .toolbar button { margin-top: 0; }
    #orders-list { display: grid; gap: 16px; }
    .order-card h3 { color: var(--accent); margin-bottom: 14px; }
    .order-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 20px; }
    .detail { color: var(--muted); }
    .detail strong { color: var(--text); font-weight: normal; }
    .items { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { padding: 9px 7px; border-top: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: normal; }
    .message { min-height: 1.3em; margin-top: 14px; color: #ff8c7d; }
    .empty { color: var(--muted); }
    @media (max-width: 600px) {
      main { width: min(100% - 20px, 1100px); padding: 24px 0; }
      .panel, .order-card { padding: 16px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .items { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main>
    <section id="login-section" class="panel login-panel">
      <h1>Taste Lahore Admin</h1>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">Log in</button>
      </form>
      <p id="login-message" class="message" role="alert"></p>
    </section>

    <section id="orders-section" hidden>
      <div class="toolbar">
        <h1>Orders</h1>
        <button id="refresh-button" type="button">Refresh</button>
      </div>
      <p id="orders-message" class="message" role="alert"></p>
      <div id="orders-list"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
